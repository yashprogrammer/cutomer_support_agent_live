name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --dev

      - name: Install spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Run tests
        run: uv run pytest tests -q

      - name: Run guardrail and smoke eval tests
        run: uv run pytest evals/test_guardrails.py evals/test_smoke_eval.py -q
